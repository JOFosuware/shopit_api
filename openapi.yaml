openapi: 3.0.3
info:
  title: Shopit API
  version: 1.0.0
  description: REST API for Shopit authentication, catalog, orders, and Stripe payment intents.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Products
  - name: Orders
  - name: Payment
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      description: Creates an account, uploads its avatar, and returns an authentication token.
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/UserAuth'}, '400': {$ref: '#/components/responses/BadRequest'}, '409': {$ref: '#/components/responses/Conflict'}, '502': {$ref: '#/components/responses/BadGateway'}, '500': {$ref: '#/components/responses/InternalError'}}
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/UserAuth'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '500': {$ref: '#/components/responses/InternalError'}}
  /auth/password/forgot:
    post:
      tags: [Authentication]
      summary: Request a password reset
      description: Always returns an accepted response to avoid disclosing whether an email is registered.
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/EmailRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/PasswordResetAccepted'}, '400': {$ref: '#/components/responses/BadRequest'}}
  /auth/password/reset/{token}:
    put:
      tags: [Authentication]
      summary: Reset a password with a reset token
      parameters: [{$ref: '#/components/parameters/Token'}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/UserAuth'}, '400': {$ref: '#/components/responses/BadRequest'}, '422': {$ref: '#/components/responses/UnprocessableEntity'}, '500': {$ref: '#/components/responses/InternalError'}}
  /auth/me:
    get:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Get the current user's profile
      responses: {'200': {$ref: '#/components/responses/UserAuthNoToken'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Revoke the presented authentication token
      responses: {'200': {$ref: '#/components/responses/SuccessMessage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '500': {$ref: '#/components/responses/InternalError'}}
  /auth/password/update:
    put:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Update the current user's password
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/UpdatePasswordRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/UserAuth'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
  /auth/me/update:
    put:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Update the current user's profile and optional avatar
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '502': {$ref: '#/components/responses/BadGateway'}, '500': {$ref: '#/components/responses/InternalError'}}
  /auth/admin/users:
    get:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: List users (admin)
      responses: {'200': {description: Users, content: {application/json: {schema: {$ref: '#/components/schemas/UserListResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '500': {$ref: '#/components/responses/InternalError'}}
  /auth/admin/user/{id}:
    get:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Get a user (admin)
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/UserAuthNoToken'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
    put:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Update a user (admin)
      parameters: [{$ref: '#/components/parameters/UUID'}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/AdminUserUpdateRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/UserAuthNoToken'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'}}
    delete:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      summary: Delete a user (admin)
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/UserAuthNoToken'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '502': {$ref: '#/components/responses/BadGateway'}, '500': {$ref: '#/components/responses/InternalError'}}
  /product/products:
    get:
      tags: [Products]
      summary: List catalog products
      parameters: [{$ref: '#/components/parameters/Keyword'}, {$ref: '#/components/parameters/ProductPage'}]
      responses: {'200': {description: Product page, content: {application/json: {schema: {$ref: '#/components/schemas/ProductListResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '500': {$ref: '#/components/responses/InternalError'}}
  /product/product/{id}:
    get:
      tags: [Products]
      summary: Get one product
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Product'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
  /product/review:
    put:
      tags: [Products]
      security: [{bearerAuth: []}]
      summary: Create or update the caller's product review
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/ReviewCreateRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
  /product/reviews:
    get:
      tags: [Products]
      security: [{bearerAuth: []}]
      summary: List reviews for a product
      parameters: [{$ref: '#/components/parameters/ProductIDQuery'}]
      responses: {'200': {description: Product reviews, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewListResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
    delete:
      tags: [Products]
      security: [{bearerAuth: []}]
      summary: Delete a product review
      parameters: [{$ref: '#/components/parameters/ProductIDQuery'}, {$ref: '#/components/parameters/ReviewIDQuery'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
  /product/new:
    post:
      tags: [Products]
      security: [{bearerAuth: []}]
      summary: Create a product (admin)
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/ProductWriteRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Product'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '502': {$ref: '#/components/responses/BadGateway'}, '500': {$ref: '#/components/responses/InternalError'}}
  /product/admin/products:
    get:
      tags: [Products]
      security: [{bearerAuth: []}]
      summary: List all products (admin)
      responses: {'200': {description: Products, content: {application/json: {schema: {$ref: '#/components/schemas/AdminProductListResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '500': {$ref: '#/components/responses/InternalError'}}
  /product/admin/product/{id}:
    put:
      tags: [Products]
      security: [{bearerAuth: []}]
      summary: Update a product (admin)
      parameters: [{$ref: '#/components/parameters/UUID'}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/ProductWriteRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Product'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '502': {$ref: '#/components/responses/BadGateway'}, '500': {$ref: '#/components/responses/InternalError'}}
    delete:
      tags: [Products]
      security: [{bearerAuth: []}]
      summary: Delete a product (admin)
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/SuccessMessage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
  /orders/new:
    post:
      tags: [Orders]
      security: [{bearerAuth: []}]
      summary: Create an order from a confirmed payment intent
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateOrderRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Order'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '402': {description: Payment is invalid, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'}}
  /orders/{id}:
    get:
      tags: [Orders]
      security: [{bearerAuth: []}]
      summary: Get an order owned by the caller or any order as admin
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Order'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
  /orders/me:
    get:
      tags: [Orders]
      security: [{bearerAuth: []}]
      summary: List the caller's orders
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Orders, content: {application/json: {schema: {$ref: '#/components/schemas/OrderListResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '500': {$ref: '#/components/responses/InternalError'}}
  /orders/admin/orders:
    get:
      tags: [Orders]
      security: [{bearerAuth: []}]
      summary: List all orders (admin)
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Orders, content: {application/json: {schema: {$ref: '#/components/schemas/OrderListResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '500': {$ref: '#/components/responses/InternalError'}}
  /orders/admin/order/{id}:
    put:
      tags: [Orders]
      security: [{bearerAuth: []}]
      summary: Update an order status (admin)
      parameters: [{$ref: '#/components/parameters/UUID'}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/OrderStatusRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'}}
    delete:
      tags: [Orders]
      security: [{bearerAuth: []}]
      summary: Delete an order (admin)
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalError'}}
  /payment/process:
    post:
      tags: [Payment]
      security: [{bearerAuth: []}]
      summary: Create a Stripe PaymentIntent using current catalog prices
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePaymentIntentRequest'}}}}
      responses: {'200': {description: Payment intent, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentIntentResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalError'}}
  /payment/stripeapi:
    get:
      tags: [Payment]
      security: [{bearerAuth: []}]
      summary: Get the Stripe publishable key
      responses: {'200': {description: Stripe API key, content: {application/json: {schema: {$ref: '#/components/schemas/StripeKeyResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '500': {$ref: '#/components/responses/InternalError'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    UUID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Token: {name: token, in: path, required: true, schema: {type: string}}
    Keyword: {name: keyword, in: query, schema: {type: string}}
    ProductPage: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    ProductIDQuery: {name: productId, in: query, required: true, schema: {type: string, format: uuid}}
    ReviewIDQuery: {name: id, in: query, required: true, schema: {type: string, format: uuid}}
  responses:
    Success: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/SuccessResponse'}}}}
    SuccessMessage: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}}}}
    UserAuth: {description: Authenticated user, content: {application/json: {schema: {$ref: '#/components/schemas/UserAuthResponse'}}}}
    UserAuthNoToken: {description: User response, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
    Product: {description: Product response, content: {application/json: {schema: {$ref: '#/components/schemas/ProductResponse'}}}}
    Order: {description: Order response, content: {application/json: {schema: {$ref: '#/components/schemas/OrderResponse'}}}}
    PasswordResetAccepted: {description: Password reset request accepted, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}}}}
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: Authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Insufficient permissions, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: Resource conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    UnprocessableEntity: {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    BadGateway: {description: Upstream service failed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    InternalError: {description: Internal server error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    RegisterRequest: {type: object, required: [name, email, password, avatar], properties: {name: {type: string}, email: {type: string, format: email}, password: {type: string, format: password, minLength: 8}, avatar: {type: string, description: Avatar data accepted by Cloudinary}}}
    LoginRequest: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, format: password, minLength: 8}}}
    EmailRequest: {type: object, required: [email], properties: {email: {type: string, format: email}}}
    ResetPasswordRequest: {type: object, required: [password, confirmPassword], properties: {password: {type: string, format: password, minLength: 8}, confirmPassword: {type: string, format: password, minLength: 8}}}
    UpdatePasswordRequest: {type: object, required: [oldPassword, password], properties: {oldPassword: {type: string, format: password}, password: {type: string, format: password, minLength: 8}}}
    ProfileUpdateRequest: {type: object, required: [name, email], properties: {name: {type: string}, email: {type: string, format: email}, avatar: {type: string, description: Optional avatar data}}}
    AdminUserUpdateRequest: {type: object, required: [name, email, role], properties: {name: {type: string}, email: {type: string, format: email}, role: {type: string, enum: [admin, user]}}}
    ProductWriteRequest: {type: object, required: [name, price, description, seller, stock], properties: {name: {type: string}, price: {type: number, format: double, exclusiveMinimum: true, minimum: 0}, description: {type: string}, category: {type: string}, seller: {type: string}, stock: {type: integer, minimum: 0}, images: {type: array, items: {type: string, format: binary}}}}
    ReviewCreateRequest: {type: object, required: [productId, rating], properties: {productId: {type: string, format: uuid}, rating: {type: integer, minimum: 1, maximum: 5}, comment: {type: string}}}
    OrderStatusRequest: {type: object, required: [status], properties: {status: {type: string, enum: [Processing, Delivered]}}}
    CreatePaymentIntentRequest: {type: object, required: [orderItems], properties: {orderItems: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/OrderItemInput'}}}}
    CreateOrderRequest: {type: object, required: [orderItems, shippingInfo, paymentInfo], properties: {orderItems: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/OrderItemInput'}}, shippingInfo: {$ref: '#/components/schemas/ShippingInput'}, paymentInfo: {$ref: '#/components/schemas/PaymentInput'}}}
    OrderItemInput: {type: object, required: [product, quantity], properties: {product: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}}
    ShippingInput: {type: object, required: [address, city, phoneNo, postalCode, country], properties: {address: {type: string}, city: {type: string}, phoneNo: {type: string}, postalCode: {type: string}, country: {type: string}}}
    PaymentInput: {type: object, required: [id], properties: {id: {type: string, description: Stripe PaymentIntent ID}}}
    Avatar: {type: object, required: [publicId, url], properties: {publicId: {type: string}, url: {type: string, format: uri}, userId: {type: string, format: uuid}}}
    User: {type: object, required: [id, name, email, role, avatar, createdAt], properties: {id: {type: string, format: uuid}, name: {type: string}, email: {type: string, format: email}, role: {type: string, enum: [admin, user]}, avatar: {$ref: '#/components/schemas/Avatar'}, createdAt: {type: string, format: date-time}}}
    Image: {type: object, properties: {publicId: {type: string}, url: {type: string, format: uri}, productId: {type: string, format: uuid}, createdAt: {type: string, format: date-time}}}
    Review: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, rating: {type: integer}, comment: {type: string}, userId: {type: string, format: uuid}, productId: {type: string, format: uuid}, createdAt: {type: string, format: date-time}}}
    Product: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, price: {type: number, format: double}, description: {type: string}, ratings: {type: integer}, images: {type: array, items: {$ref: '#/components/schemas/Image'}}, category: {type: string}, seller: {type: string}, stock: {type: integer}, numOfReviews: {type: integer}, reviews: {type: array, items: {$ref: '#/components/schemas/Review'}}, userId: {type: string, format: uuid}}}
    OrderItem: {type: object, properties: {product: {type: string, format: uuid, description: Order-item ID as serialized by the API}, name: {type: string}, price: {type: integer}, quantity: {type: integer}, image: {type: string, format: uri}, productID: {type: string, format: uuid}, orderID: {type: string, format: uuid}}}
    Payment: {type: object, properties: {id: {type: string}, status: {type: string}, orderID: {type: string, format: uuid}}}
    Shipping: {type: object, properties: {shippingID: {type: string, format: uuid}, address: {type: string}, city: {type: string}, phoneNo: {type: string}, postalCode: {type: string}, country: {type: string}, orderID: {type: string, format: uuid}}}
    Order: {type: object, properties: {id: {type: string, format: uuid}, shippingInfo: {$ref: '#/components/schemas/Shipping'}, orderItems: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}, paymentInfo: {$ref: '#/components/schemas/Payment'}, userID: {type: string, format: uuid}, paidAt: {type: string, format: date-time}, itemsPrice: {type: integer}, taxPrice: {type: number}, shippingPrice: {type: integer}, totalPrice: {type: integer}, orderStatus: {type: string}, deliveredAt: {type: string, format: date-time}, createdAt: {type: string, format: date-time}}}
    SuccessResponse: {type: object, required: [success], properties: {success: {type: boolean, example: true}}}
    MessageResponse: {type: object, required: [success, message], properties: {success: {type: boolean}, message: {type: string}}}
    ErrorResponse: {type: object, required: [success, message], properties: {success: {type: boolean, example: false}, message: {type: string}}}
    UserAuthResponse: {type: object, required: [success, token, user], properties: {success: {type: boolean}, token: {type: string}, user: {$ref: '#/components/schemas/User'}}}
    UserResponse: {type: object, required: [success, user], properties: {success: {type: boolean}, user: {$ref: '#/components/schemas/User'}}}
    UserListResponse: {type: object, required: [success, users], properties: {success: {type: boolean}, users: {type: array, items: {$ref: '#/components/schemas/User'}}}}
    ProductResponse: {type: object, required: [success, product], properties: {success: {type: boolean}, product: {$ref: '#/components/schemas/Product'}}}
    ProductListResponse: {type: object, properties: {success: {type: boolean}, productCount: {type: integer}, resPerPage: {type: integer}, filteredProductsCount: {type: integer}, products: {type: array, items: {$ref: '#/components/schemas/Product'}}}}
    AdminProductListResponse: {type: object, properties: {success: {type: boolean}, products: {type: array, items: {$ref: '#/components/schemas/Product'}}}}
    ReviewListResponse: {type: object, properties: {success: {type: boolean}, reviews: {type: array, items: {$ref: '#/components/schemas/Review'}}}}
    OrderResponse: {type: object, properties: {success: {type: boolean}, order: {$ref: '#/components/schemas/Order'}}}
    OrderListResponse: {type: object, properties: {success: {type: boolean}, orders: {type: array, items: {$ref: '#/components/schemas/Order'}}, page: {type: integer}, pageSize: {type: integer}, totalCount: {type: integer}, totalAmount: {type: integer, format: int64}}}
    PaymentIntentResponse: {type: object, required: [success, payment_id, client_secret], properties: {success: {type: boolean}, payment_id: {type: string}, client_secret: {type: string}}}
    StripeKeyResponse: {type: object, required: [stripeApiKey], properties: {stripeApiKey: {type: string}}}
